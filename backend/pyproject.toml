[project]
name = "llm-smash"
version = "0.1.0"
description = "LLM Smash Bros - Turn-based AI fighting game"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "openai>=1.0",
    "anthropic>=0.25",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_smash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
